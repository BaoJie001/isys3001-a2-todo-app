name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json
    
    - name: Install client dependencies
      run: cd client && npm ci
    
    - name: Install server dependencies
      run: cd server && npm ci
    
    - name: Run client tests
      run: cd client && npm test -- --watchAll=false --passWithNoTests
    
    - name: Run server tests
      run: cd server && npm test -- --passWithNoTests
    
    - name: Build client
      run: cd client && npm run build
      env:
        NODE_ENV: production

  quality-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Check code quality
      run: |
        echo "Running code quality checks..."
        cd client && npm run lint || echo "No lint script in client"
        cd ../server && npm run lint || echo "No lint script in server"
    
    - name: Security audit
      run: |
        cd client && npm audit --audit-level moderate || true
        cd ../server && npm audit --audit-level moderate || true